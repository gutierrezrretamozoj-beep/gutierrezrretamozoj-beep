<svg width="1000" height="320" viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241304"/>
      <stop offset="50%" stop-color="#4A2307"/>
      <stop offset="100%" stop-color="#1E1006"/>
    </linearGradient>
    <radialGradient id="glow-amber" cx="85%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb-sphere-amb" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="45%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#92400E"/>
    </radialGradient>
    <pattern id="grid-amb" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FDE68A" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    
    <linearGradient id="bar-grad-0" x1="0%" y1="0%" x2="100%" y2="0%">
