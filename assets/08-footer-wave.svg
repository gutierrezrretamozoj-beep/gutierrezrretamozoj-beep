<svg width="1000" height="145" viewBox="0 0 1000 145" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-footer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#065F46"/>
      <stop offset="28%" stop-color="#0E7490"/>
      <stop offset="56%" stop-color="#6D28D9"/>
      <stop offset="80%" stop-color="#BE185D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <clipPath id="footer-clip">
      <rect x="2" y="2" width="996" height="141" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#footer-clip)">
    <rect x="0" y="0" width="1000" height="145" fill="url(#bg-footer)"/>
    <!-- Olas suaves decorativas -->
    <path d="M0,45 Q250,5 500,45 T1000,45 L1000,145 L0,145 Z" fill="#0B1024" fill-opacity="0.32">
      <animate attributeName="d" values="M0,45 Q250,5 500,45 T1000,45 L1000,145 L0,145 Z;M0,38 Q250,72 500,38 T1000,38 L1000,145 L0,145 Z;M0,45 Q250,5 500,45 T1000,45 L1000,145 L0,145 Z" dur="7s" repeatCount="indefinite"/>
    </path>
    <path d="M0,78 Q250,112 500,78 T1000,78 L1000,145 L0,145 Z" fill="#0B1024" fill-opacity="0.28">
      <animate attributeName="d" values="M0,78 Q250,112 500,78 T1000,78 L1000,145 L0,145 Z;M0,86 Q250,52 500,86 T1000,86 L1000,145 L0,145 Z;M0,78 Q250,112 500,78 T1000,78 L1000,145 L0,145 Z" dur="5.8s" repeatCount="indefinite"/>
    </path>

    <!-- Luciérnagas en el footer -->
    <circle cx="140" cy="40" r="3" fill="#FDE68A"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="48" r="3.5" fill="#A7F3D0"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="24" r="2.5" fill="#FBCFE8"><animate attributeName="opacity" values="0.2;0.95;0.2" dur="2.5s" repeatCount="indefinite"/></circle>

    <text x="500" y="68" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="900" letter-spacing="0.8" fill="#FFFFFF">Explora el mundo interactivo en davis-world.is-a.dev</text>
    <text x="500" y="98" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FEF3C7" fill-opacity="0.92">Construido con pasión desde Barranquilla, Colombia  •  José David Gutiérrez Retamozo</text>
  </g>

  <rect x="2" y="2" width="996" height="141" rx="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.6"/>
</svg>