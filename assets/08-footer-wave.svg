<svg width="1000" height="148" viewBox="0 0 1000 148" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-footer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#065F46"/>
      <stop offset="28%" stop-color="#0E7490"/>
      <stop offset="56%" stop-color="#6D28D9"/>
      <stop offset="80%" stop-color="#BE185D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <clipPath id="footer-clip">
      <rect x="2" y="2" width="996" height="144" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#footer-clip)">
    <rect x="0" y="0" width="1000" height="148" fill="url(#bg-footer)"/>

    <!-- 3 capas de olas suaves moviéndose a distintas velocidades -->
    <path d="M0,45 Q250,5 500,45 T1000,45 L1000,148 L0,148 Z" fill="#0B1024" fill-opacity="0.34">
      <animate attributeName="d" values="M0,45 Q250,5 500,45 T1000,45 L1000,148 L0,148 Z;M0,38 Q250,76 500,38 T1000,38 L1000,148 L0,148 Z;M0,45 Q250,5 500,45 T1000,45 L1000,148 L0,148 Z" dur="6.5s" repeatCount="indefinite"/>
    </path>
    <path d="M0,78 Q250,115 500,78 T1000,78 L1000,148 L0,148 Z" fill="#0B1024" fill-opacity="0.30">
      <animate attributeName="d" values="M0,78 Q250,115 500,78 T1000,78 L1000,148 L0,148 Z;M0,88 Q250,48 500,88 T1000,88 L1000,148 L0,148 Z;M0,78 Q250,115 500,78 T1000,78 L1000,148 L0,148 Z" dur="5.2s" repeatCount="indefinite"/>
    </path>
    <path d="M0,108 Q250,86 500,108 T1000,108 L1000,148 L0,148 Z" fill="#FFFFFF" fill-opacity="0.08">
      <animate attributeName="d" values="M0,108 Q250,86 500,108 T1000,108 L1000,148 L0,148 Z;M0,104 Q250,126 500,104 T1000,104 L1000,148 L0,148 Z;M0,108 Q250,86 500,108 T1000,108 L1000,148 L0,148 Z" dur="4.4s" repeatCount="indefinite"/>
    </path>

    <!-- Estrella fugaz en el horizonte -->
    <g opacity="0">
      <line x1="0" y1="0" x2="72" y2="12" stroke="#FFFBEB" stroke-width="2" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="translate" values="60,16; 840,56; 840,56" keyTimes="0;0.26;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.95;0;0" keyTimes="0;0.1;0.26;1" dur="6s" repeatCount="indefinite"/>
    </g>

    <!-- Luciérnagas elevándose por todo el footer -->
    <circle cx="110" cy="120" r="3" fill="#FDE68A"><animate attributeName="cy" values="135;20" dur="4.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="265" cy="125" r="2.6" fill="#A7F3D0"><animate attributeName="cy" values="138;26" dur="5.0s" begin="1.1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.95;0" dur="5.0s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="130" r="2.4" fill="#FBCFE8"><animate attributeName="cy" values="140;18" dur="4.6s" begin="2.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="4.6s" begin="2.0s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="125" r="3.2" fill="#7DD3FC"><animate attributeName="cy" values="138;22" dur="5.4s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.95;0" dur="5.4s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="790" cy="130" r="2.8" fill="#FDE68A"><animate attributeName="cy" values="140;24" dur="4.1s" begin="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="4.1s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="910" cy="125" r="3.4" fill="#A7F3D0"><animate attributeName="cy" values="138;28" dur="4.9s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.95;0" dur="4.9s" begin="0.8s" repeatCount="indefinite"/></circle>

    <text x="500" y="68" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="900" letter-spacing="0.8" fill="#FFFFFF">Explora el mundo interactivo en davis-world.is-a.dev</text>
    <text x="500" y="99" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FEF3C7" fill-opacity="0.94">Construido con pasión desde Barranquilla, Colombia  •  José David Gutiérrez Retamozo</text>
  </g>

  <rect x="2" y="2" width="996" height="144" rx="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.6"/>
</svg>