    <circle cx="0" cy="0" r="22" fill="url(#orb-sphere-em)" stroke="#A7F3D0" stroke-width="1.5"/>
    <ellipse cx="-6" cy="-7" rx="6" ry="3.5" fill="#FFFFFF" fill-opacity="0.55" transform="rotate(-25 -6 -7)"/>
