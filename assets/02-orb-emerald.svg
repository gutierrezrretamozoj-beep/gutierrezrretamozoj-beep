        <animate attributeName="stroke-opacity" values="0.35;0.95;0.35" dur="3.5s" begin="0.00s" repeatCount="indefinite"/>
      </rect>
      <rect x="0" y="0" width="127" height="4" rx="2" fill="#34D399">
        <animate attributeName="opacity" values="0.55;1;0.55" dur="3.5s" begin="0.00s" repeatCount="indefinite"/>
      </rect>
