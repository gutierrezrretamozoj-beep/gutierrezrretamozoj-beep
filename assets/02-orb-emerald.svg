<svg width="1000" height="285" viewBox="0 0 1000 285" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#031D19"/>
      <stop offset="52%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#042620"/>
    </linearGradient>
    <radialGradient id="glow-emerald" cx="12%" cy="22%" r="55%">
