      <circle cx="16" cy="28" r="5" fill="#F87171">
        <animate attributeName="r" values="4.2;5.8;4.2" dur="2.8s" begin="2.10s" repeatCount="indefinite"/>
      </circle>
      <text x="29" y="26" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">Redis Cache</text>
      <text x="29" y="42" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="10.2" font-weight="600" fill="#FFFFFF" fill-opacity="0.72">In-Memory</text>
    </g>

    <!-- 3 Pilares Arquitectónicos con Pulso -->
    <g transform="translate(28, 204)">
      <rect x="0" y="0" width="304" height="50" rx="13" fill="#022C22" fill-opacity="0.86" stroke="#34D399" stroke-opacity="0.5" stroke-width="1.2"/>
      <circle cx="22" cy="25" r="5" fill="#34D399"><animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="0s" repeatCount="indefinite"/></circle>
      <text x="38" y="22" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.8" fill="#6EE7B7">ARQUITECTURA</text>
      <text x="38" y="39" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#FFFFFF">Database-First &amp; Escalable</text>

      <rect x="320" y="0" width="304" height="50" rx="13" fill="#022C22" fill-opacity="0.86" stroke="#34D399" stroke-opacity="0.5" stroke-width="1.2"/>
      <circle cx="342" cy="25" r="5" fill="#34D399"><animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="0.65s" repeatCount="indefinite"/></circle>
      <text x="358" y="22" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.8" fill="#6EE7B7">SEGURIDAD</text>
      <text x="358" y="39" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#FFFFFF">JWT, RBAC &amp; Multi-Tenant</text>

      <rect x="640" y="0" width="304" height="50" rx="13" fill="#022C22" fill-opacity="0.86" stroke="#34D399" stroke-opacity="0.5" stroke-width="1.2"/>
      <circle cx="662" cy="25" r="5" fill="#34D399"><animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="1.3s" repeatCount="indefinite"/></circle>
      <text x="678" y="22" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.8" fill="#6EE7B7">DOCUMENTACIÓN API</text>
      <text x="678" y="39" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#FFFFFF">Swagger OpenAPI &amp; Contratos</text>
