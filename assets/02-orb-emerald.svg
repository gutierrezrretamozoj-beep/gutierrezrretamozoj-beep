    <text x="195" y="46" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="1.4" fill="#A7F3D0">ORBE 01  •  ESMERALDA</text>

    <text x="112" y="80" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="900" fill="#FFFFFF">Arquitectura Backend &amp; Datos</text>
    <text x="112" y="102" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500" fill="#D1FAE5" fill-opacity="0.88">Sistemas de alto rendimiento, diseño Database-First y aislamiento multi-tenant de nivel producción</text>

