  <rect x="2" y="2" width="996" height="281" rx="22" fill="url(#glow-emerald)"/>

  <!-- Orbe Esmeralda Animado -->
  <g transform="translate(62, 62)">
    <circle cx="0" cy="0" r="34" fill="#10B981" fill-opacity="0.16">
      <animate attributeName="r" values="30;37;30" dur="3.4s" repeatCount="indefinite"/>
