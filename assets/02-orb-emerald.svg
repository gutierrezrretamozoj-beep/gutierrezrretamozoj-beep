<svg width="1000" height="285" viewBox="0 0 1000 285" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="clip-em"><rect x="2" y="2" width="996" height="281" rx="22"/></clipPath>
    <linearGradient id="bg-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#031D19"/>
      <stop offset="52%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#042620"/>
    </linearGradient>
    <radialGradient id="glow-emerald" cx="12%" cy="22%" r="55%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.42">
        <animate attributeName="stop-opacity" values="0.28;0.48;0.28" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb-sphere-em" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="45%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </radialGradient>
    <pattern id="grid-em" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#6EE7B7" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <g clip-path="url(#clip-em)">
    <rect x="2" y="2" width="996" height="281" rx="22" fill="url(#bg-emerald)"/>
    <rect x="2" y="2" width="996" height="281" rx="22" fill="url(#grid-em)"/>
    <rect x="2" y="2" width="996" height="281" rx="22" fill="url(#glow-emerald)"/>

    <!-- CIRCUITOS DE TELEMETRÍA Y PAQUETES DE DATOS EN MOVIMIENTO (DERECHA) -->
    <g stroke="#34D399" stroke-opacity="0.24" stroke-width="1.5" fill="none">
      <path d="M 670,32 L 770,32 L 792,54 L 970,54"/>
      <path d="M 720,76 L 835,76 L 855,96 L 970,96"/>
      <path d="M 650,94 L 740,94 L 762,72 L 820,72"/>
    </g>
    <!-- Paquetes brillantes viajando por el circuito -->
    <circle r="3.5" fill="#A7F3D0">
      <animateMotion dur="3.4s" repeatCount="indefinite" path="M 670,32 L 770,32 L 792,54 L 970,54"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#34D399">
      <animateMotion dur="2.9s" begin="1.1s" repeatCount="indefinite" path="M 720,76 L 835,76 L 855,96 L 970,96"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="2.9s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.8" fill="#6EE7B7">
      <animateMotion dur="2.6s" begin="0.4s" repeatCount="indefinite" path="M 650,94 L 740,94 L 762,72 L 820,72"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.6s" begin="0.4s" repeatCount="indefinite"/>
    </circle>

    <!-- Esporas esmeralda flotando hacia arriba -->
    <circle cx="880" cy="260" r="2.5" fill="#6EE7B7">
      <animate attributeName="cy" values="270;110" dur="5.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.85;0" dur="5.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="940" cy="250" r="3" fill="#34D399">
