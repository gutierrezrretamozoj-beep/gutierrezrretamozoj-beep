      <text x="29" y="42" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="10.2" font-weight="600" fill="#FFFFFF" fill-opacity="0.72">Runtime</text>
    </g>
