<svg width="1000" height="232" viewBox="0 0 1000 232" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04192B"/>
      <stop offset="50%" stop-color="#0B3D60"/>
      <stop offset="100%" stop-color="#062138"/>
    </linearGradient>
    <radialGradient id="glow-cyan" cx="15%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb-sphere-cy" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="45%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </radialGradient>
    <pattern id="grid-cy" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#7DD3FC" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect x="2" y="2" width="996" height="228" rx="22" fill="url(#bg-cyan)" stroke="#38BDF8" stroke-opacity="0.58" stroke-width="1.8"/>
