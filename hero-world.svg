<svg width="1000" height="440" viewBox="0 0 1000 440" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="rounded-frame">
      <rect x="0" y="0" width="1000" height="440" rx="22" ry="22" />
    </clipPath>
    <linearGradient id="overlay-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1B2E" stop-opacity="0.72" />
      <stop offset="50%" stop-color="#1E1B2E" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.88" />
    </linearGradient>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="35%" stop-color="#F9A8D4" />
      <stop offset="70%" stop-color="#6EE7B7" />
      <stop offset="100%" stop-color="#7DD3FC" />
    </linearGradient>
  </defs>

  <g clip-path="url(#rounded-frame)">
    <!-- TU MUNDO 3D COMO FONDO EN MOVIMIENTO -->
    

    <!-- CAPA ATMOSFÉRICA PARA QUE EL TEXTO RESALTE -->
    <rect x="0" y="0" width="1000" height="440" fill="url(#overlay-grad)" />

    <!-- LUCIÉRNAGAS ANIMADAS FLOTANDO SOBRE TU MUNDO -->
    <circle cx="140" cy="310" r="4" fill="#FDE68A">
      <animate attributeName="cy" values="310;250;310" dur="4.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;1;0.2" dur="4.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="840" cy="290" r="5" fill="#6EE7B7">
      <animate attributeName="cy" values="290;220;290" dur="5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;1;0.3" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle cx="510" cy="340" r="3.5" fill="#F9A8D4">
      <animate attributeName="cy" values="340;280;340" dur="3.6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;0.95;0.2" dur="3.6s" repeatCount="indefinite" />
    </circle>

    <!-- HUD SUPERIOR IZQUIERDO -->
    <rect x="28" y="24" width="230" height="34" rx="17" fill="#0F172A" fill-opacity="0.7" stroke="#6EE7B7" stroke-width="1.5" />
    <circle cx="48" cy="41" r="6" fill="#34D399">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="64" y="46" font-family="Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#ECFDF5">ONLINE • BARRANQUILLA, CO</text>

    <!-- HUD SUPERIOR DERECHO -->
    <rect x="742" y="24" width="230" height="34" rx="17" fill="#0F172A" fill-opacity="0.7" stroke="#F4A261" stroke-width="1.5" />
    <text x="760" y="46" font-family="Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#FEF3C7">🌅 ATARDECER • 5 ORBES</text>

    <!-- TÍTULO PRINCIPAL SUPERPUESTO AL FONDO -->
    <text x="500" y="135" text-anchor="middle" font-family="Segoe UI, Roboto, sans-serif" font-size="56" font-weight="900" letter-spacing="3" fill="url(#title-grad)">DAVID'S WORLD</text>
    <text x="500" y="172" text-anchor="middle" font-family="Segoe UI, Roboto, sans-serif" font-size="19" font-weight="600" fill="#F8FAFC">José David Gutiérrez Retamozo • Arquitecto de Mundos 3D & Full-Stack</text>

    <!-- BARRA INFERIOR TIPO VIDEOJUEGO -->
    <rect x="170" y="362" width="660" height="48" rx="24" fill="#0F172A" fill-opacity="0.82" stroke="#F9A8D4" stroke-width="1.5" />
    <text x="500" y="391" text-anchor="middle" font-family="Segoe UI, Roboto, sans-serif" font-size="15" font-weight="700" fill="#FFF8F0">
      🎮 HAZ CLIC AQUÍ PARA ENTRAR AL JUEGO EN VIVO → davis-world.is-a.dev
    </text>

    <!-- MARCO EXTERIOR NEÓN SUAVE -->
    <rect x="1" y="1" width="998" height="438" rx="22" ry="22" fill="none" stroke="url(#title-grad)" stroke-width="3" />
  </g>
</svg>
